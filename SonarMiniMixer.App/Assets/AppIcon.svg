<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Sonar Mini Mixer icon</title>
  <desc id="description">Three channel faders with colored level fills on a near-black rounded tile.</desc>
  <defs>
    <linearGradient id="tile" x1="40" y1="24" x2="224" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1828"/>
      <stop offset="0.55" stop-color="#151020"/>
      <stop offset="1" stop-color="#0E0B16"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="57" fill="url(#tile)"/>
  <rect x="10" y="10" width="236" height="236" rx="55" fill="none" stroke="#B17BEF" stroke-opacity="0.55" stroke-width="5"/>

  <g stroke-linecap="round" stroke-width="18" fill="none">
    <line x1="70" y1="62" x2="70" y2="194" stroke="#2E2539"/>
    <line x1="128" y1="62" x2="128" y2="194" stroke="#2E2539"/>
    <line x1="186" y1="62" x2="186" y2="194" stroke="#2E2539"/>
    <line x1="70" y1="194" x2="70" y2="122" stroke="#48F27A"/>
    <line x1="128" y1="194" x2="128" y2="88" stroke="#43B4FF"/>
    <line x1="186" y1="194" x2="186" y2="152" stroke="#FFB020"/>
  </g>

  <g fill="#F2E8FF">
    <rect x="48" y="112" width="44" height="18" rx="9"/>
    <rect x="106" y="78" width="44" height="18" rx="9"/>
    <rect x="164" y="142" width="44" height="18" rx="9"/>
  </g>
</svg>
