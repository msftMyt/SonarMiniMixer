name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build SonarMiniMixer.slnx -c Release --nologo
      - name: Test
        run: dotnet run --project SonarMiniMixer.Tests/SonarMiniMixer.Tests.csproj -c Release
      - name: Publish app
        run: dotnet publish SonarMiniMixer.App/SonarMiniMixer.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:ContinuousIntegrationBuild=true -p:Deterministic=true -o artifacts/publish
      - name: Publish CLI
        run: dotnet publish SonarMiniMixer.Cli/SonarMiniMixer.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:ContinuousIntegrationBuild=true -p:Deterministic=true -o artifacts/publish
